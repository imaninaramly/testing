    // AUDIO ENGINE (Web Audio API)
    // ==========================================
    const playSound = (type) => {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'correct') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'wrong') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, ctx.currentTime);
          osc.frequency.setValueAtTime(160, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
          osc.start();
          osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'timeout') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
          osc.start();
          osc.stop(ctx.currentTime + 0.5);
        }
      } catch (e) {
        console.warn('Audio Context error:', e);
      }
    };

      { q: "Kucing dan lembu bernafas menggunakan ____.", options: ["Peparu", "Insang", "Kulit lembap", "Spirakel"], a: "Peparu" },
      { q: "Manakah antara berikut merupakan makanan berkhasiat untuk gigi?", options: ["Susu berkalsium", "Gula-gula", "Air bikarbonat", "Coklat manis"], a: "Susu berkalsium" },
      { q: "Haiwan manakah yang menjaga anaknya di dalam kantung?", options: ["Kanggaru", "Kucing", "Gajah", "Singa"], a: "Kanggaru" },
      { q: "Berapakah bilangan planet dalam Sistem Suria kita?", options: ["8", "9", "7", "10"], a: "8" },
      { q: "Daun pokok berwarna hijau kerana mempunyai pigmen ____.", options: ["Klorofil", "Karoten", "Glukosa", "Oksigen"], a: "Klorofil" },
      { q: "Manakah objek buatan manusia yang menggunakan tenaga elektrik?", options: ["Peti sejuk", "Basikal roda tiga", "Lilin", "Penyapu"], a: "Peti sejuk" },
      { q: "Cacing tanah bernafas melalui ____.", options: ["Kulit lembap", "Peparu", "Insang", "Hidung"], a: "Kulit lembap" },
      { q: "Apakah rasa jus lemon tulen?", options: ["Masam", "Manis", "Pahit", "Masin"], a: "Masam" },
      { q: "Kaca mata pembesar berfungsi untuk membesarkan ____.", options: ["Imej objek kecil", "Suara", "Cahaya gelap", "Berat objek"], a: "Imej objek kecil" },
      { q: "Apakah sifat fizikal ais pada suhu bilik?", options: ["Melebur menjadi air", "Membeku", "Menjadi wap serta-merta", "Menjadi keras"], a: "Melebur menjadi air" },
      { q: "Haiwan manakah yang menggunakan cangkerang keras sebagai perlindungan?", options: ["Kura-kura", "Kucing", "Ular", "Arnab"], a: "Kura-kura" },
      { q: "Apakah deria yang digunakan untuk mendengar lagu kegemaran?", options: ["Deria pendengaran", "Deria penglihatan", "Deria sentuhan", "Deria bau"], a: "Deria pendengaran" },
      { q: "Tumbuhan membuat makanannya sendiri melalui proses ____.", options: ["Fotosintesis", "Pencernaan", "Pernafasan", "Penapaian"], a: "Fotosintesis" },
      { q: "Apakah planet yang dikenali sebagai 'Planet Merah'?", options: ["Marikh", "Musytari", "Zuhal", "Neptun"], a: "Marikh" }
    ];

    // ==========================================
    // PENJANA MATEMATIK PINTAR (50 SOALAN UNIK)
    // ==========================================
    const generateMathPool = (year, count = 50) => {
      const ops = ['+', '-', '×', '÷'];
      const list = [];

      for (let i = 0; i < count; i++) {
        const op = ops[i % ops.length];
        let n1, n2, ans, text;

        if (year === 1) {
          if (op === '+') {
            n1 = Math.floor(Math.random() * 15) + 1;
            n2 = Math.floor(Math.random() * 10) + 1;
            ans = n1 + n2;
            text = `${n1} + ${n2} = ?`;
          } else if (op === '-') {
            n2 = Math.floor(Math.random() * 10) + 1;
            n1 = n2 + Math.floor(Math.random() * 10);
            ans = n1 - n2;
            text = `${n1} − ${n2} = ?`;
          } else if (op === '×') {
            const tables = [2, 5, 10];
            n1 = tables[Math.floor(Math.random() * tables.length)];
            n2 = Math.floor(Math.random() * 9) + 1;
            ans = n1 * n2;
            text = `${n1} × ${n2} = ?`;
          } else {
            n2 = [2, 5, 10][Math.floor(Math.random() * 3)];
            ans = Math.floor(Math.random() * 5) + 1;
            n1 = n2 * ans;
            text = `${n1} ÷ ${n2} = ?`;
          }
        } else if (year === 2) {
          if (op === '+') {
            n1 = Math.floor(Math.random() * 50) + 10;
            n2 = Math.floor(Math.random() * 40) + 5;
            ans = n1 + n2;
            text = `${n1} + ${n2} = ?`;
          } else if (op === '-') {
            n2 = Math.floor(Math.random() * 40) + 5;
            n1 = n2 + Math.floor(Math.random() * 45);
            ans = n1 - n2;
            text = `${n1} − ${n2} = ?`;
          } else if (op === '×') {
            const tables = [2, 3, 4, 5, 10];
            n1 = tables[Math.floor(Math.random() * tables.length)];
            n2 = Math.floor(Math.random() * 9) + 1;
            ans = n1 * n2;
            text = `${n1} × ${n2} = ?`;
          } else {
            n2 = [2, 3, 4, 5][Math.floor(Math.random() * 4)];
            ans = Math.floor(Math.random() * 8) + 2;
            n1 = n2 * ans;
            text = `${n1} ÷ ${n2} = ?`;
          }
        } else {
          if (op === '+') {
            n1 = Math.floor(Math.random() * 400) + 100;
            n2 = Math.floor(Math.random() * 300) + 50;
            ans = n1 + n2;
            text = `${n1} + ${n2} = ?`;
          } else if (op === '-') {
            n2 = Math.floor(Math.random() * 300) + 50;
            n1 = n2 + Math.floor(Math.random() * 400);
            ans = n1 - n2;
            text = `${n1} − ${n2} = ?`;
          } else if (op === '×') {
            const tables = [6, 7, 8, 9];
            n1 = tables[Math.floor(Math.random() * tables.length)];
            n2 = Math.floor(Math.random() * 9) + 2;
            ans = n1 * n2;
            text = `${n1} × ${n2} = ?`;
          } else {
            n2 = [6, 7, 8, 9][Math.floor(Math.random() * 4)];
            ans = Math.floor(Math.random() * 9) + 2;
            n1 = n2 * ans;
            text = `${n1} ÷ ${n2} = ?`;
          }
        }

        list.push({
          q: text,
          options: [],
          a: ans.toString(),
          type: 'numpad'
        });
      }
      return list;
    };

    // Fisher-Yates Shuffle
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    const SUBJECT_CONFIG = {
      math: {
        title: "Matematik Pintar",
        tag: "+ − × ÷ Lengkap (50 Soalan)",
        icon: "🔢",
        type: "numpad"
      },
      bm: {
        title: "Bahasa Melayu",
        tag: "Tatabahasa (50 Soalan)",
        icon: "📖",
        type: "mcq"
      },
      bi: {
        title: "English Ace",
        tag: "Grammar & Vocab (50 Questions)",
        icon: "🔤",
        type: "mcq"
      },
      science: {
        title: "Sains Eksplorasi",
        tag: "Inkuiri & Alam (50 Soalan)",
        icon: "🔬",
        type: "mcq"
      }
    };

    // ==========================================
    // KOMPONEN UTAMA
    // ==========================================
    function App() {
      const [screen, setScreen] = useState('hub');
      const [activeSubject, setActiveSubject] = useState('math');
      const [activeYear, setActiveYear] = useState(1);
      const [sessionQuestions, setSessionQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [inputVal, setInputVal] = useState('');
      const [score, setScore] = useState(0);
      const [correctCount, setCorrectCount] = useState(0);
      const [combo, setCombo] = useState(0);
      const [highestCombo, setHighestCombo] = useState(0);
      const [feedback, setFeedback] = useState(null);
      const [timeLeft, setTimeLeft] = useState(20);
      const [highScores, setHighScores] = useState(() => {
        const saved = localStorage.getItem('edubox_highscores_50');
        return saved ? JSON.parse(saved) : {};
      });

      const timerRef = useRef(null);
      const TOTAL_QUESTIONS = 50;

      // Pemasa 20 Saat
      useEffect(() => {
        if (screen !== 'quiz' || feedback) return;

        setTimeLeft(20);
        clearInterval(timerRef.current);

        timerRef.current = setInterval(() => {
          setTimeLeft((prev) => {
            if (prev <= 1) {
              clearInterval(timerRef.current);
              handleTimeOut();
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timerRef.current);
      }, [screen, currentIndex, feedback]);

      const handleTimeOut = () => {
        playSound('timeout');
        setCombo(0);
        const correct = sessionQuestions[currentIndex]?.a;
        setFeedback({
          status: 'timeout',
          text: `Masa Tamat! ⏰ (Jawapan: ${correct})`
        });

        setTimeout(nextQuestionOrResult, 1400);
      };

      const startSession = (subjKey, year) => {
        playSound('click');
        setActiveSubject(subjKey);
        setActiveYear(year);
        setScore(0);
        setCorrectCount(0);
        setCombo(0);
        setHighestCombo(0);
        setCurrentIndex(0);
        setInputVal('');
        setFeedback(null);

        let pool = [];
        if (subjKey === 'math') {
          pool = generateMathPool(year, TOTAL_QUESTIONS);
        } else if (subjKey === 'bm') {
          pool = BM_QUESTIONS;
        } else if (subjKey === 'bi') {
          pool = BI_QUESTIONS;
        } else if (subjKey === 'science') {
          pool = SAINS_QUESTIONS;
        }

        // Rawakkan susunan 50 soalan dan rawakkan susunan pilihan jawapan
        const shuffled = shuffleArray(pool).slice(0, TOTAL_QUESTIONS).map(item => {
          if (item.options && item.options.length > 0) {
            return {
              ...item,
              options: shuffleArray(item.options)
            };
          }
          return item;
        });

        setSessionQuestions(shuffled);
        setScreen('quiz');
      };

      const checkAnswer = (userAns) => {
        if (feedback || !userAns) return;
        clearInterval(timerRef.current);

        const currentQ = sessionQuestions[currentIndex];
        const isRight = userAns.toString().trim().toLowerCase() === currentQ.a.toString().trim().toLowerCase();

        if (isRight) {
          playSound('correct');
          const bonus = Math.floor(timeLeft * 0.5);
          const addedScore = 10 + bonus;
          setScore((s) => s + addedScore);
          setCorrectCount((c) => c + 1);
          setCombo((c) => {
            const nextC = c + 1;
            if (nextC > highestCombo) setHighestCombo(nextC);
            return nextC;
          });
          setFeedback({
            status: 'correct',
            text: combo >= 2 ? `Hebat! Combo x${combo + 1} 🔥 (+${addedScore})` : `Tepat Sekali! 🎉 (+${addedScore})`
          });
        } else {
          playSound('wrong');
          setCombo(0);
          setFeedback({
            status: 'wrong',
            text: `Kurang Tepat! ❌ (Jawapan: ${currentQ.a})`
          });
        }

        setTimeout(nextQuestionOrResult, 1300);
      };

      const nextQuestionOrResult = () => {
        if (currentIndex + 1 >= sessionQuestions.length) {
          if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 90, origin: { y: 0.6 } });
          }
          const key = `${activeSubject}_${activeYear}`;
          const currentBest = highScores[key] || 0;
          if (score > currentBest) {
            const updated = { ...highScores, [key]: score };
            setHighScores(updated);
            localStorage.setItem('edubox_highscores_50', JSON.stringify(updated));
          }
          setScreen('result');
        } else {
          setCurrentIndex((i) => i + 1);
          setInputVal('');
          setFeedback(null);
        }
      };

      const handleNumpadInput = (key) => {
        if (feedback) return;
        playSound('click');
        if (key === 'del') {
          setInputVal((prev) => prev.slice(0, -1));
        } else if (key === 'enter') {
          if (inputVal.length > 0) checkAnswer(inputVal);
        } else {
          if (inputVal.length < 5) setInputVal((prev) => prev + key);
        }
      };

      // ==========================================
      // PAPARAN 1: HUB UTAMA
      // ==========================================
      if (screen === 'hub') {
        return (
          <div className="flex flex-col h-full justify-between p-5 sm:p-6 bg-slate-50">
            <div>
              {/* Header */}
              <div className="bg-gradient-to-br from-indigo-700 via-indigo-600 to-purple-700 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden mb-6">
                <div className="absolute top-0 right-0 w-36 h-36 bg-white/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                <div className="flex items-center justify-between mb-3">
                  <span className="bg-amber-400 text-slate-900 text-[11px] px-3 py-1 rounded-full font-black uppercase tracking-wider shadow-sm">
                    💎 Modul Penuh 50 Soalan
                  </span>
                  <span className="text-xs font-bold text-indigo-200">KSSR Semakan</span>
                </div>
                <h1 className="text-2xl sm:text-3xl font-black tracking-tight">StudyBox Pintar 🚀</h1>
                <p className="text-xs text-indigo-100 font-semibold mt-1">
                  50 Soalan Sekaligus • Pilihan Jawapan Dirawakkan
                </p>
              </div>

              {/* Pemilihan Tahun */}
              <div className="mb-6">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-black uppercase tracking-wider text-slate-400">Pilih Tahap Tahun</span>
                  <span className="text-[11px] font-bold text-indigo-600">Tahun 1, 2 & 3</span>
                </div>
                <div className="grid grid-cols-3 gap-2 bg-slate-200/80 p-1.5 rounded-2xl">
                  {[1, 2, 3].map((yr) => (
                    <button
                      key={yr}
                      onClick={() => { playSound('click'); setActiveYear(yr); }}
                      className={`py-3 rounded-xl font-extrabold text-xs transition-all duration-200 ${
                        activeYear === yr
                          ? 'bg-white shadow-md text-indigo-700 scale-100'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Tahun {yr}
                    </button>
                  ))}
                </div>
              </div>

              {/* Subjek Grid */}
              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-black uppercase tracking-wider text-slate-400">Pilih Subjek Pembelajaran</span>
                <span className="text-[11px] font-bold text-slate-400">20s Setiap Soalan ⏱️</span>
              </div>

              <div className="grid grid-cols-2 gap-3.5">
                {Object.keys(SUBJECT_CONFIG).map((key) => {
                  const s = SUBJECT_CONFIG[key];
                  const best = highScores[`${key}_${activeYear}`] || 0;
                  return (
                    <button
                      key={key}
                      onClick={() => startSession(key, activeYear)}
                      className="group bg-white p-4 rounded-3xl border-2 border-slate-100 shadow-sm hover:border-indigo-400 hover:shadow-md active:scale-95 transition-all text-left flex flex-col justify-between h-40 relative overflow-hidden"
                    >
                      <div className="flex items-center justify-between">
                        <span className="text-3xl p-2 bg-slate-50 rounded-2xl group-hover:scale-110 transition">{s.icon}</span>
                        {best > 0 && (
                          <span className="text-[10px] bg-amber-100 text-amber-800 font-black px-2 py-0.5 rounded-full">
                            ★ {best}
                          </span>
                        )}
                      </div>
                      <div>
                        <h3 className="font-black text-slate-800 text-sm leading-snug">{s.title}</h3>
                        <p className="text-[11px] font-bold text-slate-400 mt-0.5">{s.tag}</p>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="mt-4 pt-3 border-t border-slate-200/60 text-center">
              <p className="text-[11px] font-bold text-slate-400">
                ✨ 50 Soalan Berterusan • Pilihan Jawapan A-D Rawak
              </p>
            </div>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 2: KEPUTUSAN KUIZ (50 SOALAN)
      // ==========================================
      if (screen === 'result') {
        const accuracy = Math.round((correctCount / TOTAL_QUESTIONS) * 100);
        const grade = accuracy >= 85 ? 'Cemerlang A+' : accuracy >= 70 ? 'Amat Baik A' : accuracy >= 50 ? 'Lulus B' : 'Perlu Usaha C';

        return (
          <div className="flex flex-col h-full justify-between p-6 bg-slate-50 text-center">
            <div className="my-auto">
              <div className="w-20 h-20 bg-amber-100 text-amber-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner">
                🏆
              </div>
              <h2 className="text-2xl font-black text-slate-800">50 Soalan Selesai Dijawab!</h2>
              <p className="text-xs font-bold text-slate-400 mt-1">
                {SUBJECT_CONFIG[activeSubject].title} • Tahun {activeYear}
              </p>

              <div className="bg-white border-2 border-slate-100 rounded-3xl p-5 my-6 shadow-sm">
                <span className="text-xs uppercase font-black text-indigo-500 tracking-wider block mb-1">Jumlah Markah Terkumpul</span>
                <div className="text-4xl font-black text-indigo-700">{score}</div>
                <div className="inline-block mt-2 bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full text-xs font-extrabold">
                  Ketepatan: {accuracy}% ({correctCount}/50) • {grade}
                </div>

                <div className="grid grid-cols-2 gap-2 mt-4 pt-4 border-t border-slate-100 text-left">
                  <div className="bg-slate-50 p-3 rounded-2xl">
                    <span className="text-[10px] uppercase font-bold text-slate-400 block">Streak Tertinggi</span>
                    <span className="text-base font-black text-slate-700">{highestCombo}x Combo</span>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-2xl">
                    <span className="text-[10px] uppercase font-bold text-slate-400 block">Status Modul</span>
                    <span className="text-base font-black text-emerald-600">Selesai 50/50 ✓</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="flex flex-col gap-2.5">
              <button
                onClick={() => startSession(activeSubject, activeYear)}
                className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-sm active:scale-95 shadow-lg shadow-indigo-200 transition"
              >
                Cuba Lagi (Soalan & Jawapan Dirawakkan Semula) ↺
              </button>
              <button
                onClick={() => { playSound('click'); setScreen('hub'); }}
                className="w-full py-3.5 bg-white border-2 border-slate-200 text-slate-700 rounded-2xl font-extrabold text-sm active:scale-95 transition"
              >
                Kembali ke Menu Utama
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 3: KUIZ AKTIF
      // ==========================================
      const currentQ = sessionQuestions[currentIndex];
      const isNumpad = currentQ?.type === 'numpad' || SUBJECT_CONFIG[activeSubject].type === 'numpad';
      const timerProgress = (timeLeft / 20) * 100;
      const timerColor = timeLeft > 10 ? 'bg-emerald-500' : timeLeft > 5 ? 'bg-amber-500' : 'bg-rose-500 animate-pulse';
      const optionLabels = ['A', 'B', 'C', 'D'];

      return (
        <div className="flex flex-col h-full justify-between p-5 bg-slate-50 select-none">
          {/* Top Bar Header */}
          <div>
            <div className="flex items-center justify-between mb-2">
              <button
                onClick={() => { playSound('click'); setScreen('hub'); }}
                className="w-9 h-9 rounded-2xl bg-white border border-slate-200 font-black text-slate-400 flex items-center justify-center hover:bg-slate-100 active:scale-90 transition"
              >
                ✕
              </button>
              <div className="text-center">
                <span className="text-xs font-black text-slate-800 block">
                  {SUBJECT_CONFIG[activeSubject].title}
                </span>
                <span className="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                  Tahun {activeYear}
                </span>
              </div>
              <div className="bg-amber-100 border border-amber-200 text-amber-800 px-3 py-1 rounded-2xl text-xs font-black">
                ⭐ {score}
              </div>
            </div>

            {/* Pemasa Visual 20 Saat & Status Bilangan Soalan */}
            <div className="mt-3 bg-white p-2.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-3">
              <span className="text-xs font-black text-slate-700 flex items-center gap-1">
                ⏱️ {timeLeft}s
              </span>
              <div className="flex-1 bg-slate-100 h-3 rounded-full overflow-hidden p-0.5">
                <div
                  className={`h-full rounded-full transition-all duration-1000 ${timerColor}`}
                  style={{ width: `${timerProgress}%` }}
                />
              </div>
              <span className="text-[11px] font-black text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-lg">
                {currentIndex + 1} / {sessionQuestions.length}
              </span>
            </div>
          </div>

          {/* Kad Soalan */}
          <div className="my-auto py-2">
            {feedback && (
              <div
                className={`text-center text-xs font-black py-2 px-4 rounded-2xl mb-3 w-max mx-auto shadow-md transition-all ${
                  feedback.status === 'correct'
                    ? 'bg-emerald-500 text-white'
                    : 'bg-rose-500 text-white animate-shake'
                }`}
              >
                {feedback.text}
              </div>
            )}

            <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-6 text-center shadow-sm relative overflow-hidden">
              <span className="text-[10px] font-black uppercase tracking-wider text-indigo-500 block mb-2">
                Soalan {currentIndex + 1} daripada {sessionQuestions.length}
              </span>
              <h2 className="text-xl sm:text-2xl font-black text-slate-800 leading-snug">
                {currentQ?.q}
              </h2>

              {isNumpad && (
                <div className="mt-5">
                  <div className="inline-flex items-center justify-center min-w-[120px] h-14 bg-indigo-50/70 border-b-4 border-indigo-600 rounded-2xl px-4 text-3xl font-black text-indigo-700 tracking-wider shadow-inner">
                    {inputVal || <span className="text-indigo-300">?</span>}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* Pilihan Jawapan Rawak (MCQ A-D / Numpad) */}
          <div className="mb-2">
            {!isNumpad ? (
              <div className="grid grid-cols-1 gap-2.5">
                {currentQ?.options?.map((opt, idx) => (
                  <button
                    key={idx}
                    disabled={Boolean(feedback)}
                    onClick={() => checkAnswer(opt)}
                    className="w-full py-3.5 px-4 bg-white hover:bg-indigo-50/60 border-2 border-slate-200 hover:border-indigo-500 rounded-2xl text-sm font-extrabold text-slate-700 active:scale-[0.98] transition-all text-left shadow-sm flex items-center justify-between group"
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-7 h-7 rounded-xl bg-slate-100 group-hover:bg-indigo-600 group-hover:text-white flex items-center justify-center text-xs font-black text-slate-500 transition-colors">
                        {optionLabels[idx]}
                      </span>
                      <span className="text-slate-800">{opt}</span>
                    </div>
                  </button>
                ))}
              </div>
            ) : (
              <div className="grid grid-cols-3 gap-2">
                {[1, 2, 3, 4, 5, 6, 7, 8, 9].map((num) => (
                  <button
                    key={num}
                    onClick={() => handleNumpadInput(num.toString())}
                    className="h-12 bg-white border border-slate-200 hover:border-indigo-400 rounded-2xl font-black text-lg text-slate-700 active:bg-slate-100 shadow-sm active:scale-95 transition"
                  >
                    {num}
                  </button>
                ))}
                <button
                  onClick={() => handleNumpadInput('del')}
                  className="h-12 bg-rose-50 border border-rose-100 hover:bg-rose-100 rounded-2xl font-black text-sm text-rose-600 active:scale-95 transition flex items-center justify-center"
                >
                  Padam ⌫
                </button>
                <button
                  onClick={() => handleNumpadInput('0')}
                  className="h-12 bg-white border border-slate-200 rounded-2xl font-black text-lg text-slate-700 active:bg-slate-100 shadow-sm active:scale-95 transition"
                >
                  0
                </button>
                <button
                  onClick={() => handleNumpadInput('enter')}
                  className="h-12 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-sm active:scale-95 shadow-md shadow-indigo-200 transition flex items-center justify-center"
                >
                  Semak ✓
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
