      {"id":"MATH1-U2-T4-Q152","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak dengan mengumpul semula (pinjam dari puluh)","difficulty":"medium","level":2,"type":"fill_in_the_blank","question":"63 - 7 = [______]","options":["54","56","57","64"],"answer":"56","explanation":"3 sa tidak boleh tolak 7 sa. Kumpul semula 1 puluh: 13 sa - 7 sa = 6 sa. Puluh tinggal 5. Jawapannya 56.","source":"Buku Teks Jilid 1, Halaman 89"},
      {"id":"MATH1-U2-T4-Q153","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak dua nombor dua digit dengan kumpul semula","difficulty":"hard","level":3,"type":"short_answer","question":"Kira beza antara 50 dengan 24.","options":["26","36","24","16"],"answer":"26","explanation":"Kumpul semula 1 puluh menjadi 10 sa: 10 - 4 = 6 sa. 4 puluh - 2 puluh = 2 puluh. Jawapannya 26.","source":"Buku Teks Jilid 1, Halaman 90"},
      {"id":"MATH1-U2-T4-Q154","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak dua nombor dua digit secara kumpul semula","difficulty":"hard","level":3,"type":"fill_in_the_blank","question":"42 - 28 = [______]","options":["14","16","24","26"],"answer":"14","explanation":"Kumpul semula 1 puluh: 12 sa - 8 sa = 4 sa. Puluh tinggal 3: 3 puluh - 2 puluh = 1 puluh. Jawapannya 14.","source":"Buku Teks Jilid 1, Halaman 91"},
      {"id":"MATH1-U2-T4-Q155","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Mencari nilai anu dalam operasi tolak berkumpul semula","difficulty":"hard","level":3,"type":"short_answer","question":"31 - [____] = 25. Apakah nilai dalam petak kosong?","options":["5","6","7","8"],"answer":"6","explanation":"31 - 25 = 6. Maka nilai anu tersebut ialah 6.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q156","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Mencari anu dalam operasi tolak dengan kumpul semula","difficulty":"hard","level":3,"type":"short_answer","question":"Berapakah nombor di dalam petak: [____] - 28 = 12?","options":["38","40","42","16"],"answer":"40","explanation":"Nombor asal dicari dengan menjumlahkan baki dan nombor yang ditolak: 28 + 12 = 40.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q157","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak bentuk lazim dengan mengumpul semula","difficulty":"medium","level":2,"type":"fill_in_the_blank","question":"53 - 8 = [______]","options":["44","45","46","35"],"answer":"45","explanation":"13 sa - 8 sa = 5 sa. Puluh tinggal 4. Jawapannya 45.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q158","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak dua nombor puluh dengan pengumpulan semula sa","difficulty":"hard","level":3,"type":"mcq","question":"Kira 60 - 44.","options":["16","26","14","24"],"answer":"16","explanation":"10 sa - 4 sa = 6 sa. 5 puluh - 4 puluh = 1 puluh. Jawapannya 16.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q159","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak nombor dua digit berturutan","difficulty":"medium","level":2,"type":"short_answer","question":"Selesaikan: 95 - 88 = ","options":["6","7","8","9"],"answer":"7","explanation":"15 sa tolak 8 sa ialah 7. 8 puluh tolak 8 puluh ialah 0. Hasilnya 7.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q160","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak nombor dengan kumpul semula sa","difficulty":"medium","level":2,"type":"fill_in_the_blank","question":"34 - 15 = [______]","options":["18","19","21","29"],"answer":"19","explanation":"14 sa - 5 sa = 9 sa. 2 puluh - 1 puluh = 1 puluh. Jawapannya 19.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q161","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Menolak dua nombor dua digit yang melibatkan sifar","difficulty":"hard","level":3,"type":"short_answer","question":"Berapakah nilai 40 - 28?","options":["11","12","13","22"],"answer":"12","explanation":"10 sa - 8 sa = 2 sa. 3 puluh - 2 puluh = 1 puluh. Jawapannya 12.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T4-Q162","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Kemahiran Menolak","subtopic":"Tolak Lagi","learning_objective":"Mencari anu penolakan kumpul semula","difficulty":"hard","level":3,"type":"fill_in_the_blank","question":"26 - [______] = 17.","options":["8","9","10","11"],"answer":"9","explanation":"26 tolak 17 ialah 9.","source":"Buku Teks Jilid 1, Halaman 92"},
      {"id":"MATH1-U2-T5-Q163","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Membina cerita tambah berpandukan objek","difficulty":"easy","level":1,"type":"mcq","question":"Ada 5 kereta mainan merah dan 3 kereta mainan biru. Cerita tambah yang betul ialah:","options":["Semuanya ada 8 kereta mainan.","Kereta merah kurang 2 daripada kereta biru.","Ada 2 kereta mainan yang tinggal.","Kereta mainan rosak ada 8."],"answer":"Semuanya ada 8 kereta mainan.","explanation":"5 digabung bersama 3 menghasilkan jumlah 8 kereta mainan semuanya (5 + 3 = 8).","source":"Buku Teks Jilid 1, Halaman 93"},
      {"id":"MATH1-U2-T5-Q164","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Membina cerita tambah daripada ayat matematik","difficulty":"medium","level":2,"type":"mcq","question":"Pilih cerita yang tepat bagi ayat matematik 18 + 7 = 25.","options":["Ibu buat 18 karipap dan beri 7 kepada jiran. Tinggal 25 karipap.","Farah ada 18 pelekat. Kakak beri 7 pelekat lagi. Jumlah pelekat Farah ialah 25.","Ada 25 murid. 18 murid perempuan dan 7 murid keluar kelas.","Farah kumpul 18 manik, hilang 7 manik. Jumlahnya 25."],"answer":"Farah ada 18 pelekat. Kakak beri 7 pelekat lagi. Jumlah pelekat Farah ialah 25.","explanation":"Penambahan berlaku apabila bilangan asal 18 ditambah dengan 7 menghasilkan 25.","source":"Buku Teks Jilid 1, Halaman 96"},
      {"id":"MATH1-U2-T5-Q165","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Memadankan ayat matematik dengan situasi cerita yang betul","difficulty":"medium","level":2,"type":"mcq","question":"Situasi manakah yang sepadan dengan ayat matematik 10 - 3 = 7?","options":["Ada 10 biji telur. Ibu beli lagi 3 biji. Semuanya ada 7 biji.","Ada 10 biji telur. 3 biji telur telah pecah. Baki telur yang elok ialah 7 biji.","Ada 7 biji telur. Ibu masak 3 biji. Tinggal 10 biji.","Ada 10 biji telur. 7 biji telur pecah. Baki telur ialah 13 biji."],"answer":"Ada 10 biji telur. 3 biji telur telah pecah. Baki telur yang elok ialah 7 biji.","explanation":"Telur pecah membawa maksud pengurangan kuantiti (operasi tolak: 10 - 3 = 7).","source":"Buku Teks Jilid 1, Halaman 94"},
      {"id":"MATH1-U2-T5-Q166","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Membina situasi penambahan berdasarkan maklumat berayat","difficulty":"medium","level":2,"type":"mcq","question":"Ayat manakah yang paling sesuai menggambarkan operasi 45 + 50 = 95?","options":["Sara ada wang RM45. Ibunya memberi RM50 lagi. Jumlah wang Sara ialah RM95.","Sara ada wang RM95. Dia berbelanja RM50. Wangnya bertambah RM45.","Sara ada RM50. Dia beri RM45 kepada adiknya. Bakinya RM95.","Sara simpan RM95 setiap hari selama 45 hari."],"answer":"Sara ada wang RM45. Ibunya memberi RM50 lagi. Jumlah wang Sara ialah RM95.","explanation":"Menerima wang lagi menunjukkan situasi penambahan kuantiti wang asal.","source":"Buku Teks Jilid 1, Halaman 95"},
      {"id":"MATH1-U2-T5-Q167","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Membina cerita tolak daripada ayat matematik","difficulty":"medium","level":2,"type":"mcq","question":"Cerita manakah yang betul bagi ayat matematik 37 - 16 = 21?","options":["Selvi ada 37 manik. Dia beri Azi 16 manik. Manik Selvi tinggal 21.","Selvi beli 37 manik lagi dan Azi beri 16 manik. Semuanya ada 21.","Selvi ada 21 manik. Azi ambil 16 manik. Jumlahnya 37.","Selvi ada 16 manik, kemudian hilang 21 manik."],"answer":"Selvi ada 37 manik. Dia beri Azi 16 manik. Manik Selvi tinggal 21.","explanation":"Memberi manik kepada kawan menunjukkan operasi tolak.","source":"Buku Teks Jilid 1, Halaman 95"},
      {"id":"MATH1-U2-T5-Q168","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Reka Cerita Tambah dan Tolak","learning_objective":"Mengenal pasti cerita tolak melibatkan perkataan kurang","difficulty":"medium","level":2,"type":"fill_in_the_blank","question":"Ibu jual 58 roti hari Ahad. Hari Isnin dia jual 13 roti kurang daripada Ahad. Ayat matematiknya ialah 58 - 13 = [______].","options":["45","42","71","35"],"answer":"45","explanation":"58 - 13 = 45 keping roti.","source":"Buku Teks Jilid 1, Halaman 95"},
      {"id":"MATH1-U2-T5-Q169","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah harian operasi tambah","difficulty":"medium","level":2,"type":"problem_solving","question":"Encik Arif ada 7 batang pen biru dan 5 batang pen merah. Berapakah jumlah pen Encik Arif kesemuanya?","options":["11","12","13","10"],"answer":"12","explanation":"Jumlah pen = 7 + 5 = 12 batang pen.","source":"Buku Teks Jilid 1, Halaman 97"},
      {"id":"MATH1-U2-T5-Q170","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah harian operasi tolak","difficulty":"medium","level":2,"type":"problem_solving","question":"Bapa Lina tanam 17 pokok jagung. 4 pokok jagung mati. Berapakah bilangan pokok jagung yang masih hidup?","options":["12","13","14","21"],"answer":"13","explanation":"Pokok yang tinggal = 17 - 4 = 13 pokok.","source":"Buku Teks Jilid 1, Halaman 98"},
      {"id":"MATH1-U2-T5-Q171","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah harian baki buah-buahan","difficulty":"easy","level":1,"type":"problem_solving","question":"Ho ada 10 biji limau. Dia memberi 6 biji kepada Raju. Berapakah baki limau Ho?","options":["3","4","5","16"],"answer":"4","explanation":"10 - 6 = 4 biji limau.","source":"Buku Teks Jilid 1, Halaman 99"},
      {"id":"MATH1-U2-T5-Q172","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah situasi penolakan berayat","difficulty":"medium","level":2,"type":"problem_solving","question":"Agil membawa 21 biji pisang. Dia dan rakan-rakannya telah makan 16 biji pisang tersebut. Berapakah baki pisang yang tinggal?","options":["4","5","6","7"],"answer":"5","explanation":"21 - 16 = 5 biji pisang yang tinggal.","source":"Buku Teks Jilid 1, Halaman 100"},
      {"id":"MATH1-U2-T5-Q173","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah situasi lebih daripada","difficulty":"medium","level":2,"type":"problem_solving","question":"Samir kumpul 13 keping setem. Muaz kumpul 4 keping setem lebih daripada Samir. Kira bilangan setem Muaz.","options":["16","17","18","9"],"answer":"17","explanation":"13 + 4 = 17 keping setem.","source":"Buku Teks Jilid 1, Halaman 101"},
      {"id":"MATH1-U2-T5-Q174","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah dua digit melibatkan konsep 'lebih daripada'","difficulty":"hard","level":3,"type":"problem_solving","question":"Ravi membaca 30 buah komik. Zul membaca 34 buah komik lebih daripada Ravi. Berapakah jumlah komik yang dibaca oleh Zul?","options":["60","64","68","4"],"answer":"64","explanation":"Zul membaca lebih 34 komik daripada 30. Ayat matematik: 30 + 34 = 64 buah komik.","source":"Buku Teks Jilid 1, Halaman 95 & 102"},
      {"id":"MATH1-U2-T5-Q175","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah penambahan melibatkan jadual","difficulty":"hard","level":3,"type":"problem_solving","question":"Pada tahun 2016 ada 39 peserta Hari Guru. Pada tahun 2017 bilangannya bertambah sebanyak 26 orang. Berapakah jumlah peserta pada tahun 2017?","options":["64","65","66","55"],"answer":"65","explanation":"39 + 26 = 65 orang peserta.","source":"Buku Teks Jilid 1, Halaman 102"},
      {"id":"MATH1-U2-T5-Q176","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah berayat mencari nilai anu (operasi tambah)","difficulty":"hard","level":3,"type":"problem_solving","question":"Kumari ada 14 batang pensel warna di dalam bekas. Dia memasukkan beberapa batang pensel lagi sehingga jumlahnya menjadi 23. Berapakah batang pensel yang dimasukkan oleh Kumari?","options":["7","8","9","10"],"answer":"9","explanation":"Ayat matematik: 14 + [anu] = 23. Cari anu: 23 - 14 = 9 batang pensel.","source":"Buku Teks Jilid 1, Halaman 103"},
      {"id":"MATH1-U2-T5-Q177","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Mencari nilai asal menggunakan songsangan operasi tambah","difficulty":"hard","level":3,"type":"problem_solving","question":"Beberapa ekor kura-kura ada di dalam kolam. 6 ekor lagi masuk ke dalam kolam menjadikan jumlahnya 10 ekor. Berapakah kura-kura yang ada di kolam pada mulanya?","options":["3","4","5","16"],"answer":"4","explanation":"[anu] + 6 = 10. Nilai anu: 10 - 6 = 4 ekor kura-kura.","source":"Buku Teks Jilid 1, Halaman 104"},
      {"id":"MATH1-U2-T5-Q178","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah tolak berayat mencari nilai permulaan (anu)","difficulty":"hard","level":3,"type":"problem_solving","question":"Zura menyediakan 58 batang aiskrim. Dia telah menjual beberapa batang aiskrim. Baki aiskrim yang belum dijual ialah 12 batang. Berapakah batang aiskrim yang telah dijual oleh Zura?","options":["46","48","70","36"],"answer":"46","explanation":"58 - [anu] = 12. Maka anu = 58 - 12 = 46 batang aiskrim.","source":"Buku Teks Jilid 1, Halaman 105"},
      {"id":"MATH1-U2-T5-Q179","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah situasi bas sekolah","difficulty":"medium","level":2,"type":"problem_solving","question":"Sebuah bas membawa 15 orang murid. Di satu taman perumahan, 7 orang murid lagi menaiki bas tersebut. Berapakah jumlah murid di dalam bas sekarang?","options":["21","22","23","8"],"answer":"22","explanation":"15 + 7 = 22 orang murid.","source":"Buku Teks Jilid 1, Halaman 106"},
      {"id":"MATH1-U2-T5-Q180","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Mencari bilangan manik kawan (anu penambahan)","difficulty":"hard","level":3,"type":"problem_solving","question":"Jumlah manik Reetha dan Dayang ialah 56 biji. Reetha mempunyai 38 biji manik. Berapakah biji manik kepunyaan Dayang?","options":["16","18","28","94"],"answer":"18","explanation":"38 + [anu] = 56. Maka anu = 56 - 38 = 18 biji manik.","source":"Buku Teks Jilid 1, Halaman 106"},
      {"id":"MATH1-U2-T5-Q181","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah baki bahan masakan","difficulty":"easy","level":1,"type":"problem_solving","question":"Ibu membeli 48 biji telur. Dia memasak 12 biji daripadanya. Berapakah baki telur yang belum dimasak?","options":["34","36","38","60"],"answer":"36","explanation":"48 - 12 = 36 biji telur.","source":"Buku Teks Jilid 1, Halaman 106"},
      {"id":"MATH1-U2-T5-Q182","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah ternakan ayam sakit","difficulty":"medium","level":2,"type":"problem_solving","question":"Bapa Ah Meng memelihara 52 ekor anak ayam. 6 ekor daripada anak ayam itu sakit. Berapakah bilangan anak ayam yang sihat?","options":["44","45","46","48"],"answer":"46","explanation":"52 - 6 = 46 ekor anak ayam.","source":"Buku Teks Jilid 1, Halaman 106"},
      {"id":"MATH1-U2-T5-Q183","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah jumlah jantina murid","difficulty":"easy","level":1,"type":"problem_solving","question":"Di dalam kelas ada 16 orang murid lelaki dan 12 orang murid perempuan. Berapakah jumlah murid di dalam kelas itu?","options":["26","28","30","4"],"answer":"28","explanation":"16 + 12 = 28 orang murid.","source":"Buku Teks Jilid 1, Halaman 107"},
      {"id":"MATH1-U2-T5-Q184","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah menyusun kotak limau","difficulty":"medium","level":2,"type":"problem_solving","question":"Faiz menyusun 35 kotak limau. Ranjit pula menyusun 28 kotak lagi. Kira jumlah semua kotak limau yang disusun mereka.","options":["62","63","64","53"],"answer":"63","explanation":"35 + 28 = 63 kotak limau.","source":"Buku Teks Jilid 1, Halaman 107"},
      {"id":"MATH1-U2-T5-Q185","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah situasi penolakan berayat","difficulty":"medium","level":2,"type":"problem_solving","question":"Sebuah kelas mempunyai 25 orang murid. 9 orang daripada mereka memakai cermin mata. Berapakah orang murid yang tidak memakai cermin mata?","options":["14","15","16","17"],"answer":"16","explanation":"25 - 9 = 16 orang murid yang tidak memakai cermin mata.","source":"Buku Teks Jilid 1, Halaman 107"},
      {"id":"MATH1-U2-T5-Q186","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Menyelesaikan masalah dua langkah berasaskan jadual data mudah","difficulty":"hard","level":3,"type":"problem_solving","question":"Dalam acara sukan, Rumah Kuning memperoleh 91 mata manakala Rumah Merah memperoleh 67 mata. Berapakah lebihnya mata Rumah Kuning berbanding Rumah Merah?","options":["24","26","34","36"],"answer":"24","explanation":"Cari beza: 91 - 67 = 24 mata.","source":"Buku Teks Jilid 1, Halaman 107"},
      {"id":"MATH1-U2-T5-Q187","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Aplikasi Tambah dan Tolak","subtopic":"Selesaikan Masalah Tambah & Tolak","learning_objective":"Mencari nilai mata rumah sukan menggunakan beza","difficulty":"hard","level":3,"type":"problem_solving","question":"Rumah Merah mendapat 67 mata. Beza mata Rumah Biru dengan Rumah Merah ialah 10, dan Rumah Biru mempunyai mata yang lebih tinggi. Berapakah mata Rumah Biru?","options":["57","77","87","68"],"answer":"77","explanation":"67 + 10 = 77 mata.","source":"Buku Teks Jilid 1, Halaman 107"},
      {"id":"MATH1-U2-T6-Q188","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Operasi Berulang","subtopic":"Tambah Berulang","learning_objective":"Menulis ayat matematik tambah berulang dua-dua","difficulty":"easy","level":1,"type":"fill_in_the_blank","question":"Ada 3 kumpulan poskad. Setiap kumpulan ada 2 poskad. Ayat matematik tambah berulang ialah: 2 + 2 + 2 = [______].","options":["4","5","6","8"],"answer":"6","explanation":"3 kumpulan dua-dua ialah 2 + 2 + 2 = 6.","source":"Buku Teks Jilid 1, Halaman 108"},
      {"id":"MATH1-U2-T6-Q189","subject":"Matematik","year":1,"chapter":"Unit 2: Tambah dan Tolak","topic":"Operasi Berulang","subtopic":"Tambah Berulang","learning_objective":"Mengenal konsep kumpulan sama banyak","difficulty":"easy","level":1,"type":"mcq","question":"Apakah maksud 'tambah berulang'?","options":["Menjumlahkan nombor-nombor yang berlainan","Menjumlahkan dua atau lebih nombor yang sama","Menolak nombor yang sama berkali-kali","Membilang nombor secara rawak"],"answer":"Menjumlahkan dua atau lebih nombor yang sama","explanation":"Tambah berulang merujuk kepada objek yang dikumpul dalam bilangan sama banyak dan dijumlahkan.","source":"Buku Teks Jilid 1, Halaman 108"},

            if (b.reqType === 'completedTopics' && completedTopics.length >= b.reqVal) unlock = true;
            if (b.reqType === 'streak' && streak >= b.reqVal) unlock = true;

                  <span className="text-[11px] font-bold text-indigo-700">KSSR Semakan</span>
                </div>
                <div className="grid grid-cols-3 gap-2 bg-slate-200/80 p-1.5 rounded-2xl">
                  {[1, 2, 3].map((yr) => (
                    <button
                      key={yr}
                      onClick={() => { playSound('click'); setSelectedYear(yr); }}
                      className={`py-3 rounded-xl font-black text-xs transition-all ${
                        selectedYear === yr
                          ? 'bg-white text-indigo-700 shadow-sm scale-100'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      Tahun {yr}
                    </button>
                  ))}
                </div>
              </div>

              {/* Kemajuan */}
              <div className="mb-5">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-black uppercase tracking-wider text-slate-600">Status Kemajuan Keseluruhan</span>
                  <span className="text-[11px] font-black text-emerald-600">{progressPercent}% Kuasai</span>
                </div>
                <div className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 shadow-sm">
                  <div className="flex items-center justify-between mb-3">
                    <div className="flex items-center gap-2.5">
                      <span className="text-2xl p-2 bg-indigo-50 rounded-xl">📚</span>
                      <div>
                        <h4 className="font-black text-slate-800 text-sm">Modul Tahun {selectedYear}</h4>
                        <p className="text-[11px] font-bold text-slate-600">{completedTopics.length} Topik Berjaya Dikuasai</p>
                      </div>
                    </div>
                  </div>
                  <div className="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div
                      className="bg-indigo-600 h-full rounded-full transition-all duration-700"
                      style={{ width: `${Math.max(5, progressPercent)}%` }}
                    />
                  </div>
                </div>
              </div>

              {/* Modul Subjek Grid */}
              <div className="mb-2">
                <span className="text-xs font-black uppercase tracking-wider text-slate-600 block mb-2.5">
                  Subjek Tahun {selectedYear}
                </span>
                <div className="grid grid-cols-2 gap-3">
                  {Object.keys(SUBJECT_META).map((subjKey) => {
                    const s = SUBJECT_META[subjKey];
                    const topicsList = (SYLLABUS_DATA[selectedYear] && SYLLABUS_DATA[selectedYear][subjKey]) || [];
                    const completedInSubj = topicsList.filter(t => completedTopics.includes(t.id)).length;

                    return (
                      <button
                        key={subjKey}
                        onClick={() => {
                          playSound('click');
                          setSelectedSubject(subjKey);
                          setView('syllabus');
                        }}
                        className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 text-left active:bg-slate-50 transition shadow-sm flex flex-col justify-between h-36"
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-3xl">{s.icon}</span>
                          <span className="text-[10px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full">
                            {completedInSubj}/{topicsList.length}
                          </span>
                        </div>
                        <div>
                          <h4 className="font-black text-slate-800 text-sm">{s.title}</h4>
                          <p className="text-[11px] font-bold text-slate-600">{topicsList.length} Unit Pembelajaran</p>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            </div>

            {/* Bottom Nav Bar */}
            <div className="pt-3 border-t border-slate-200/80 flex items-center justify-around">
              <button onClick={() => setView('dashboard')} className="flex flex-col items-center gap-1 text-indigo-700 font-bold text-[11px]">
                <span className="text-xl">🏠</span> Utama
              </button>
              <button onClick={() => { playSound('click'); setView('badges'); }} className="flex flex-col items-center gap-1 text-slate-600 hover:text-slate-800 font-bold text-[11px]">
                <span className="text-xl">🏆</span> Lencana ({unlockedBadges.length})
              </button>
              <button onClick={() => { playSound('click'); setView('progress'); }} className="flex flex-col items-center gap-1 text-slate-600 hover:text-slate-800 font-bold text-[11px]">
                <span className="text-xl">📊</span> Analisis
              </button>
            </div>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 2: SENARAI SILIBUS SUBJEK
      // ==========================================
      if (view === 'syllabus') {
        const topics = (SYLLABUS_DATA[selectedYear] && SYLLABUS_DATA[selectedYear][selectedSubject]) || [];
        const sMeta = SUBJECT_META[selectedSubject];

        return (
          <div className="flex flex-col h-full justify-between p-5 bg-[#F8FAFC]">
            <div>
              <div className="flex items-center justify-between mb-4">
                <button
                  onClick={() => { playSound('click'); setView('dashboard'); }}
                  className="w-10 h-10 rounded-2xl bg-white border border-slate-200 flex items-center justify-center font-black text-slate-600 active:scale-95 transition"
                >
                  ←
                </button>
                <div className="text-center">
                  <h2 className="text-sm font-black text-slate-900">{sMeta.title}</h2>
                  <span className="text-[10px] font-extrabold text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded-full">
                    Tahun {selectedYear}
                  </span>
                </div>
                <div className="w-10"></div>
              </div>

              <div className="flex items-center justify-between mb-3">
                <span className="text-xs font-black uppercase tracking-wider text-slate-600">Pilih Topik Pembelajaran</span>
                <span className="text-[11px] font-bold text-slate-600">Nota • Latihan • Kuiz</span>
              </div>

              {/* Senarai Topik */}
              <div className="space-y-3 overflow-y-auto max-h-[580px] no-scrollbar pr-0.5">
                {topics.map((t, idx) => {
                  const isDone = completedTopics.includes(t.id);
                  return (
                    <div
                      key={t.id}
                      className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 shadow-sm flex items-center justify-between"
                    >
                      <div className="flex items-center gap-3.5">
                        <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-slate-100 text-slate-600'}`}>
                          {isDone ? '✓' : t.icon}
                        </div>
                        <div className="max-w-[190px]">
                          <div className="flex items-center gap-2">
                            <span className="text-[10px] font-black uppercase text-indigo-700">{t.title.split(':')[0]}</span>
                            {isDone && <span className="text-[9px] bg-emerald-100 text-emerald-700 font-extrabold px-1.5 py-0.5 rounded">Dikuasai</span>}
                          </div>
                          <h4 className="font-black text-slate-800 text-xs truncate">{t.title.split(':')[1] || t.title}</h4>
                          <p className="text-[10px] font-bold text-slate-600">{t.quiz ? t.quiz.length + 2 : 3} Soalan Penilaian</p>
                        </div>
                      </div>

                      <button
                        onClick={() => startTopicLearning(t)}
                        className={`px-3.5 py-2.5 rounded-xl font-black text-xs active:scale-95 transition ${
                          isDone ? 'bg-slate-100 text-slate-700 hover:bg-slate-200' : 'bg-indigo-600 text-white shadow-md shadow-indigo-200'
                        }`}
                      >
                        {isDone ? 'Ulang ↺' : 'Mula 🚀'}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            <button
              onClick={() => setView('dashboard')}
              className="w-full py-3.5 bg-slate-200/80 text-slate-700 rounded-2xl font-black text-xs active:scale-95 transition"
            >
              Kembali ke Menu Utama
            </button>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 3: MODUL PEMBELAJARAN 4-LANGKAH
      // ==========================================
      if (view === 'learn') {
        const stepTitles = ['Nota Ringkas 💡', 'Contoh Aplikasi 📝', 'Latihan Pantas ✏️', 'Kuiz Penilaian 🧠', 'Tahniah! 🏆'];
        const optionAlphabet = ['A', 'B', 'C', 'D'];

        return (
          <div className="flex flex-col h-full justify-between p-5 bg-[#F8FAFC]">
            <div>
              <div className="flex items-center justify-between mb-3">
                <button
                  onClick={() => { playSound('click'); setView('syllabus'); }}
                  className="w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center font-bold text-slate-600 text-xs active:scale-95 transition"
                >
                  ✕
                </button>
                <span className="text-xs font-black text-slate-800 truncate max-w-[200px]">{activeTopic.title}</span>
                <span className="text-[10px] font-black bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full">
                  Langkah {learnStep + 1}/5
                </span>
              </div>

              {/* Step Tracker Pills */}
              <div className="grid grid-cols-5 gap-1.5 mb-4">
                {[0, 1, 2, 3, 4].map(st => (
                  <div
                    key={st}
                    className={`h-2 rounded-full transition-all duration-300 ${
                      learnStep === st ? 'bg-indigo-600' : learnStep > st ? 'bg-emerald-500' : 'bg-slate-200'
                    }`}
                  />
                ))}
              </div>
            </div>

            {/* NOTA */}
            {learnStep === 0 && (
              <div className="my-auto py-2">
                <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-6 shadow-sm">
                  <span className="text-xs font-black uppercase text-amber-700 bg-amber-50 px-3 py-1 rounded-full inline-block mb-3">
                    {stepTitles[0]}
                  </span>
                  <h3 className="text-base font-black text-slate-900 mb-2">{activeTopic.note.heading}</h3>
                  <p className="text-xs font-semibold text-slate-700 leading-relaxed whitespace-pre-line">
                    {activeTopic.note.body}
                  </p>
                </div>
              </div>
            )}

            {/* CONTOH */}
            {learnStep === 1 && (
              <div className="my-auto py-2">
                <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-6 shadow-sm">
                  <span className="text-xs font-black uppercase text-blue-700 bg-blue-50 px-3 py-1 rounded-full inline-block mb-3">
                    {stepTitles[1]}
                  </span>
                  <h4 className="text-xs font-bold text-slate-600 uppercase mb-1">Soalan Contoh:</h4>
                  <p className="text-sm font-black text-slate-800 mb-4">{activeTopic.example.q}</p>
                  
                  <div className="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4">
                    <span className="text-xs font-black text-indigo-700 block mb-1">💡 Cara Selesai & Penjelasan:</span>
                    <p className="text-xs font-bold text-indigo-900 leading-normal">{activeTopic.example.explanation}</p>
                  </div>
                </div>
              </div>
            )}

            {/* LATIHAN */}
            {learnStep === 2 && (
              <div className="my-auto py-2">
                {practiceFeedback && (
                  <div className={`text-center text-xs font-black py-2 px-4 rounded-2xl mb-3 w-max mx-auto shadow-sm ${
                    practiceFeedback.status === 'correct' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white animate-shake'
                  }`}>
                    {practiceFeedback.text}
                  </div>
                )}
                <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-6 shadow-sm mb-4">
                  <span className="text-xs font-black uppercase text-purple-700 bg-purple-50 px-3 py-1 rounded-full inline-block mb-2">
                    {stepTitles[2]}
                  </span>
                  <h3 className="text-sm font-black text-slate-800">{activeTopic.practice.q}</h3>
                </div>

                <div className="space-y-2">
                  {activeTopic.practice.options.map((opt, idx) => (
                    <button
                      key={idx}
                      onClick={() => checkPractice(opt)}
                      className={`w-full py-3.5 px-4 bg-white border-2 rounded-2xl text-xs font-black text-left flex items-center justify-between transition-all ${
                        practiceSelected === opt
                          ? opt === activeTopic.practice.a ? 'border-emerald-500 bg-emerald-50 text-emerald-900' : 'border-rose-500 bg-rose-50 text-rose-900'
                          : 'border-slate-200/80 text-slate-700 active:bg-slate-50'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center text-[10px] font-black text-slate-600">
                          {optionAlphabet[idx]}
                        </span>
                        <span>{opt}</span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* KUIZ */}
            {learnStep === 3 && (
              <div className="my-auto py-2">
                <div className="bg-white p-2.5 rounded-2xl border border-slate-200/80 mb-3 flex items-center gap-3 shadow-sm">
                  <span className="text-xs font-black text-slate-700">⏱️ {quizTimer}s</span>
                  <div className="flex-1 bg-slate-100 h-2.5 rounded-full overflow-hidden">
                    <div
                      className={`h-full rounded-full transition-all duration-1000 ${quizTimer > 10 ? 'bg-emerald-500' : quizTimer > 5 ? 'bg-amber-500' : 'bg-rose-500'}`}
                      style={{ width: `${(quizTimer / 20) * 100}%` }}
                    />
                  </div>
                  <span className="text-[11px] font-black text-indigo-700">Soalan {quizIndex + 1}/{activeTopic.quiz.length}</span>
                </div>

                {quizFeedback && (
                  <div className={`text-center text-xs font-black py-2 px-4 rounded-2xl mb-3 w-max mx-auto shadow-sm ${
                    quizFeedback.status === 'correct' ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white animate-shake'
                  }`}>
                    {quizFeedback.text}
                  </div>
                )}

                <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-5 text-center shadow-sm mb-4">
                  <h3 className="text-sm font-black text-slate-800 leading-snug">
                    {activeTopic.quiz[quizIndex].q}
                  </h3>
                </div>

                <div className="space-y-2">
                  {activeTopic.quiz[quizIndex].options.map((opt, idx) => (
                    <button
                      key={idx}
                      disabled={Boolean(quizFeedback)}
                      onClick={() => checkQuizAnswer(opt)}
                      className="w-full py-3 px-4 bg-white border-2 border-slate-200/80 rounded-2xl text-xs font-black text-slate-700 active:bg-indigo-50 active:border-indigo-400 text-left flex items-center justify-between shadow-sm transition"
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center text-[10px] font-black text-slate-600">
                          {optionAlphabet[idx]}
                        </span>
                        <span>{opt}</span>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            )}

            {/* MASTERED */}
            {learnStep === 4 && (
              <div className="my-auto py-4 text-center">
                <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-3xl flex items-center justify-center text-4xl mx-auto mb-4 shadow-inner">
                  🏆
                </div>
                <h2 className="text-2xl font-black text-slate-800">Unit Berjaya Dikuasai!</h2>
                <p className="text-xs font-bold text-slate-600 mt-1">{activeTopic.title} • Selesai Penuh</p>

                <div className="bg-white border-2 border-slate-200/80 rounded-3xl p-5 my-5 shadow-sm">
                  <span className="text-xs uppercase font-black text-indigo-700 block mb-1">Ganjaran Pembelajaran</span>
                  <div className="text-3xl font-black text-indigo-700">+65 XP Diperoleh ⭐</div>
                  <p className="text-[11px] font-bold text-slate-600 mt-2">
                    Skor Kuiz: {quizScore} / {activeTopic.quiz.length} Soalan Tepat
                  </p>
                </div>
              </div>
            )}

            {/* Butang Tindakan */}
            <div>
              {learnStep < 2 && (
                <button
                  onClick={() => { playSound('click'); setLearnStep(s => s + 1); }}
                  className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-xs shadow-lg shadow-indigo-200 active:scale-95 transition"
                >
                  Seterusnya: {stepTitles[learnStep + 1]} →
                </button>
              )}
              {learnStep === 2 && (
                <button
                  disabled={!practiceFeedback}
                  onClick={() => { playSound('click'); setLearnStep(3); }}
                  className={`w-full py-4 rounded-2xl font-black text-xs active:scale-95 transition ${
                    practiceFeedback ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-200' : 'bg-slate-200 text-slate-600 cursor-not-allowed'
                  }`}
                >
                  Masuk Ke Kuiz Penilaian ({activeTopic.quiz.length} Soalan) →
                </button>
              )}
              {learnStep === 4 && (
                <button
                  onClick={() => { playSound('click'); setView('syllabus'); }}
                  className="w-full py-4 bg-emerald-600 text-white rounded-2xl font-black text-xs shadow-lg shadow-emerald-200 active:scale-95 transition"
                >
                  Selesai & Pilih Unit Lain ✓
                </button>
              )}
            </div>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 4: LENCANA PENCAPAIAN (BADGES)
      // ==========================================
      if (view === 'badges') {
        return (
          <div className="flex flex-col h-full justify-between p-5 bg-[#F8FAFC]">
            <div>
              <div className="flex items-center justify-between mb-4">
                <button
                  onClick={() => { playSound('click'); setView('dashboard'); }}
                  className="w-10 h-10 rounded-2xl bg-white border border-slate-200 flex items-center justify-center font-black text-slate-600 text-xs active:scale-95 transition"
                >
                  ←
                </button>
                <div className="text-center">
                  <h2 className="text-sm font-black text-slate-900">Koleksi Lencana</h2>
                  <span className="text-[10px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-full">
                    {unlockedBadges.length} daripada {BADGES_CONFIG.length} Terbuka
                  </span>
                </div>
                <div className="w-10"></div>
              </div>

              <div className="grid grid-cols-2 gap-3 max-h-[600px] overflow-y-auto no-scrollbar pr-0.5">
                {BADGES_CONFIG.map(b => {
                  const isUnlocked = unlockedBadges.includes(b.id);
                  return (
                    <div
                      key={b.id}
                      className={`p-4 rounded-3xl border-2 text-center flex flex-col items-center justify-between h-44 transition ${
                        isUnlocked ? 'bg-white border-amber-300 shadow-sm' : 'bg-slate-100/70 border-slate-200 opacity-60'
                      }`}
                    >
                      <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mb-2 ${
                        isUnlocked ? 'bg-amber-100' : 'bg-slate-200 grayscale'
                      }`}>
                        {b.icon}
                      </div>
                      <div>
                        <h4 className="font-black text-slate-800 text-xs">{b.name}</h4>
                        <p className="text-[10px] font-semibold text-slate-600 mt-0.5 leading-snug">{b.desc}</p>
                      </div>
                      <span className={`text-[9px] font-black px-2 py-0.5 rounded-full ${
                        isUnlocked ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-200 text-slate-600'
                      }`}>
                        {isUnlocked ? 'Dibuka ✓' : 'Terkunci 🔒'}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>

            <button
              onClick={() => setView('dashboard')}
              className="w-full py-3.5 bg-slate-200/80 text-slate-700 rounded-2xl font-black text-xs active:scale-95 transition"
            >
              Kembali ke Dashboard
            </button>
          </div>
        );
      }

      // ==========================================
      // PAPARAN 5: ANALISIS KEMAJUAN (PROGRESS)
      // ==========================================
      if (view === 'progress') {
        return (
          <div className="flex flex-col h-full justify-between p-5 bg-[#F8FAFC]">
            <div>
              <div className="flex items-center justify-between mb-4">
                <button
                  onClick={() => { playSound('click'); setView('dashboard'); }}
                  className="w-10 h-10 rounded-2xl bg-white border border-slate-200 flex items-center justify-center font-black text-slate-600 text-xs active:scale-95 transition"
                >
                  ←
                </button>
                <h2 className="text-sm font-black text-slate-900">Analisis Prestasi</h2>
                <div className="w-10"></div>
              </div>

              <div className="space-y-3">
                <div className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl p-2 bg-amber-50 rounded-xl">⭐</span>
                    <div>
                      <span className="text-[10px] font-bold text-slate-600 uppercase">Jumlah XP</span>
                      <h4 className="font-black text-slate-800 text-base">{xp} XP</h4>
                    </div>
                  </div>
                  <span className="text-xs font-black text-amber-700">Peringkat Pintar 🚀</span>
                </div>

                <div className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl p-2 bg-emerald-50 rounded-xl">📚</span>
                    <div>
                      <span className="text-[10px] font-bold text-slate-600 uppercase">Topik Selesai</span>
                      <h4 className="font-black text-slate-800 text-base">{completedTopics.length} Modul</h4>
                    </div>
                  </div>
                  <span className="text-xs font-black text-emerald-600">Aktif</span>
                </div>

                <div className="bg-white p-4 rounded-3xl border-2 border-slate-200/80 shadow-sm flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <span className="text-2xl p-2 bg-rose-50 rounded-xl">🔥</span>
                    <div>
                      <span className="text-[10px] font-bold text-slate-600 uppercase">Streak Pembelajaran</span>
                      <h4 className="font-black text-slate-800 text-base">{streak} Hari</h4>
                    </div>
                  </div>
                  <span className="text-xs font-black text-rose-600">Konsisten</span>
                </div>

                <div className="p-4 bg-indigo-50 border border-indigo-100 rounded-3xl">
                  <h4 className="text-xs font-black text-indigo-900 mb-1">💡 Tips Belajar</h4>
                  <p className="text-[11px] font-bold text-indigo-700 leading-relaxed">
                    Selesaikan kesemua topik Matematik Tahun 1 (Unit 1 & Unit 2) untuk meraih lencana Math Master dan Edu Pintar Master!
                  </p>
                </div>
              </div>
            </div>

            <button
              onClick={() => setView('dashboard')}
              className="w-full py-3.5 bg-slate-200/80 text-slate-700 rounded-2xl font-black text-xs active:scale-95 transition"
            >
              Kembali ke Dashboard
            </button>
          </div>
        );
      }

      return null;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
