/* =========================================================
   AUDIO
========================================================= */

const playSound = (type) => {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    if (type === "correct") {
      osc.type = "triangle";
      osc.frequency.setValueAtTime(523.25, ctx.currentTime);
      osc.frequency.setValueAtTime(659.25, ctx.currentTime + .1);
      osc.frequency.setValueAtTime(783.99, ctx.currentTime + .2);
      gain.gain.setValueAtTime(.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .4);
      osc.start();
      osc.stop(ctx.currentTime + .4);
    }

    if (type === "wrong") {
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(220, ctx.currentTime);
      osc.frequency.setValueAtTime(160, ctx.currentTime + .15);
      gain.gain.setValueAtTime(.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .4);
      osc.start();
      osc.stop(ctx.currentTime + .4);
    }

    if (type === "click") {
      osc.type = "sine";
      osc.frequency.setValueAtTime(800, ctx.currentTime);
      gain.gain.setValueAtTime(.04, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.01, ctx.currentTime + .05);
      osc.start();
      osc.stop(ctx.currentTime + .05);
    }

  } catch(e) {}
};

/* =========================================================
   MATH QUESTION GENERATOR
========================================================= */

function generateMathQuestions(year, count = 12) {

  const questions = [];

  for (let i = 0; i < count; i++) {

    let a, b, answer, operation;

    const operationIndex = i % 4;

    if (year === 1) {

      if (operationIndex === 0) {
        a = Math.floor(Math.random() * 15) + 1;
        b = Math.floor(Math.random() * 10) + 1;
        answer = a + b;
        operation = `${a} + ${b} = ?`;
      }

      if (operationIndex === 1) {
        b = Math.floor(Math.random() * 8) + 1;
        a = b + Math.floor(Math.random() * 10) + 1;
        answer = a - b;
        operation = `${a} − ${b} = ?`;
      }

      if (operationIndex === 2) {
        a = [2,5,10][Math.floor(Math.random()*3)];
        b = Math.floor(Math.random()*5)+1;
        answer = a*b;
        operation = `${a} × ${b} = ?`;
      }

      if (operationIndex === 3) {
        b = [2,5,10][Math.floor(Math.random()*3)];
        answer = Math.floor(Math.random()*5)+1;
        a = b*answer;
        operation = `${a} ÷ ${b} = ?`;
      }
    }

    if (year === 2) {

      if (operationIndex === 0) {
        a = Math.floor(Math.random()*80)+20;
        b = Math.floor(Math.random()*60)+10;
        answer = a+b;
        operation = `${a} + ${b} = ?`;
      }

      if (operationIndex === 1) {
        b = Math.floor(Math.random()*50)+10;
        a = b+Math.floor(Math.random()*50)+10;
        answer = a-b;
        operation = `${a} − ${b} = ?`;
      }

      if (operationIndex === 2) {
        a = [2,3,4,5,10][Math.floor(Math.random()*5)];
        b = Math.floor(Math.random()*10)+1;
        answer = a*b;
        operation = `${a} × ${b} = ?`;
      }

      if (operationIndex === 3) {
        b = [2,3,4,5][Math.floor(Math.random()*4)];
        answer = Math.floor(Math.random()*8)+2;
        a = b*answer;
        operation = `${a} ÷ ${b} = ?`;
      }
    }

    if (year === 3) {

      if (operationIndex === 0) {
        a = Math.floor(Math.random()*500)+100;
        b = Math.floor(Math.random()*400)+50;
        answer = a+b;
        operation = `${a} + ${b} = ?`;
      }

      if (operationIndex === 1) {
        b = Math.floor(Math.random()*300)+50;
        a = b+Math.floor(Math.random()*400)+20;
        answer = a-b;
        operation = `${a} − ${b} = ?`;
      }

      if (operationIndex === 2) {
        a = Math.floor(Math.random()*8)+2;
        b = Math.floor(Math.random()*10)+2;
        answer = a*b;
        operation = `${a} × ${b} = ?`;
      }

      if (operationIndex === 3) {
        b = Math.floor(Math.random()*8)+2;
        answer = Math.floor(Math.random()*9)+2;
        a = b*answer;
        operation = `${a} ÷ ${b} = ?`;
      }
    }

    questions.push({
      q: operation,
      options: [],
      a: String(answer),
      type: "numpad"
    });
  }

  return questions;
}


/* =========================================================
   HELPERS
========================================================= */

function shuffle(array) {
  const copy = [...array];

  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }

  return copy;
}

function getStoredProgress() {
  try {
    return JSON.parse(localStorage.getItem("edubox_progress")) || {
      xp: 1240,
      streak: 5,
      completedLessons: 24,
      quizzes: 18,
      scores: {}
    };
  } catch {
    return {
      xp: 1240,
      streak: 5,
      completedLessons: 24,
      quizzes: 18,
      scores: {}
    };
  }
}

========================================================= */

function NavButton({

  onClick,
  icon,
  label

    <button

      className={`px-3 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 ${

          : "text-slate-500 hover:bg-slate-50"
      }`}
    >
      <span>{icon}</span>
      {label}
    </button>

  );
}


function MobileNav({
  icon,
  label,
  active,
  onClick
}) {

  return (

    <button
      onClick={onClick}
      className={`flex flex-col items-center gap-1 py-1 rounded-xl ${
        active
          ? "text-indigo-600"

      <span className="text-xl">

      <span className="text-[9px] font-black">
        {label}
      </span>

    </button>
